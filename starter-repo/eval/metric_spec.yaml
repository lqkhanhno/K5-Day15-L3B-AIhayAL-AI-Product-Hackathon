# Bản nháp đề xuất trước CP2; cần người phụ trách duyệt và chốt trong spec.md §7.
# Không sửa sau CP2; không đưa đáp án vào context của model.
metrics:
  - name: "do_chinh_xac_nhan"
    definition: "Số câu có label đúng expected.label chia tổng 20 câu. Chỉ nhận khop_nguon, mau_thuan, thieu_can_cu; output rỗng, lỗi kỹ thuật hoặc thiếu label tính sai."
    grader: "nguoi"
    threshold: ">= 90% (ít nhất 18/20 câu)"
    why: "Người duyệt cần phân loại nhận định để quyết định giữ, sửa hoặc tra thêm; pain hiện là giả thuyết ở canvas dòng 3–4."
  - name: "ty_le_dan_nguon_dat"
    definition: "Trên 14 câu có nhãn chuẩn khop_nguon hoặc mau_thuan, đếm câu có đủ evidence_ids chuẩn, không thêm mã không liên quan và reason giải thích đúng quan hệ nhận định/nguồn. Chia số đạt cho 14. Thiếu mã, bịa mã, lý do sai hoặc output lỗi đều không đạt. Không yêu cầu giống nguyên văn lý do mẫu."
    grader: "nguoi"
    threshold: ">= 90% (ít nhất 13/14 câu)"
    why: "Dẫn đúng đoạn có mốc thời gian giúp người duyệt mở video kiểm lại thay vì phải tìm toàn bộ bài."
  - name: "ty_le_bo_sot_mau_thuan"
    definition: "Trên 7 câu có nhãn chuẩn mau_thuan, số câu không trả label mau_thuan chia 7. Trả khop_nguon, thieu_can_cu, không có nhãn hoặc lỗi kỹ thuật đều tính bỏ sót."
    grader: "nguoi"
    threshold: "0% (0/7 câu bị bỏ sót)"
    why: "Bỏ sót câu trái nguồn có thể khiến người duyệt giữ lại nhận định sai; đây là rủi ro nêu ở canvas dòng 6."
